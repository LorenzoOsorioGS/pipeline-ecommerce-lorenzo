services:
  mongo:
    image: mongo:7.0
    container_name: ecommerce-mongo
    restart: unless-stopped
    ports:
      - "127.0.0.1:27017:27017"   # só a própria máquina acessa; ambiente de desenvolvimento, sem autenticação
    volumes:
      - mongo_data:/data/db        # os dados sobrevivem a "docker compose down"
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

  mongo-express:
    image: mongo-express:1.0.2
    container_name: ecommerce-mongo-express
    restart: unless-stopped
    ports:
      - "127.0.0.1:8081:8081"
    environment:
      ME_CONFIG_MONGODB_URL: mongodb://mongo:27017/
      ME_CONFIG_BASICAUTH: "true"
      ME_CONFIG_BASICAUTH_USERNAME: ${ME_USER:-admin}
      ME_CONFIG_BASICAUTH_PASSWORD: ${ME_PASSWORD:-admin123}
    depends_on:
      mongo:
        condition: service_healthy   # só sobe quando o MongoDB responde ao ping

volumes:
  mongo_data:
